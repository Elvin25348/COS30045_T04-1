<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #f4f7f3;
      color: #26352b;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 840px;
      margin: 0 auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #526b57;
      border-radius: 8px;
      background: #cfeeff;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">A House and Garden</title>
      <desc id="scene-desc">A sunny garden with a cloud, leafy tree, small house, fence, and curved path through the grass.</desc>

      <!-- Sky and grass -->
      <rect x="0" y="0" width="800" height="330" fill="#cfeeff" />
      <rect x="0" y="330" width="800" height="170" fill="#8bc879" />

      <!-- Sun and cloud -->
      <circle cx="690" cy="85" r="42" fill="#ffd34e" />
      <ellipse cx="185" cy="105" rx="50" ry="25" fill="#fff" />
      <ellipse cx="155" cy="112" rx="29" ry="20" fill="#fff" />
      <ellipse cx="211" cy="116" rx="33" ry="18" fill="#fff" />

      <!-- Tree -->
      <rect x="95" y="255" width="34" height="105" fill="#87522f" />
      <circle cx="112" cy="222" r="55" fill="#3f994f" />
      <circle cx="78" cy="245" r="34" fill="#4eaa59" />
      <circle cx="147" cy="245" r="36" fill="#368b47" />

      <!-- House -->
      <rect x="300" y="225" width="250" height="160" fill="#f2c987" stroke="#835c3d" stroke-width="3" />
      <polygon points="280,230 425,120 570,230" fill="#b84f3f" stroke="#79392f" stroke-width="4" />
      <rect x="475" y="145" width="36" height="64" fill="#9b493b" stroke="#79392f" stroke-width="3" />
      <rect x="395" y="300" width="58" height="85" fill="#76503a" stroke="#543a2b" stroke-width="3" />
      <circle cx="441" cy="344" r="4" fill="#f6d76b" />
      <rect x="325" y="255" width="54" height="48" fill="#bce9f5" stroke="#805a3e" stroke-width="4" />
      <line x1="352" y1="255" x2="352" y2="303" stroke="#805a3e" stroke-width="3" />
      <line x1="325" y1="279" x2="379" y2="279" stroke="#805a3e" stroke-width="3" />
      <rect x="473" y="255" width="54" height="48" fill="#bce9f5" stroke="#805a3e" stroke-width="4" />
      <line x1="500" y1="255" x2="500" y2="303" stroke="#805a3e" stroke-width="3" />
      <line x1="473" y1="279" x2="527" y2="279" stroke="#805a3e" stroke-width="3" />

      <!-- Fence -->
      <polyline points="20,350 20,310 45,310 45,350 70,350 70,310 95,310 95,350 120,350 120,310 145,310 145,350 170,350 170,310 195,310 195,350"
        fill="none" stroke="#f5e4bd" stroke-width="7" stroke-linejoin="round" />
      <line x1="20" y1="324" x2="195" y2="324" stroke="#d2b98d" stroke-width="5" />
      <line x1="20" y1="342" x2="195" y2="342" stroke="#d2b98d" stroke-width="5" />

      <!-- Curved garden path -->
      <path d="M 420 385 C 390 415, 440 440, 405 500 L 560 500 C 525 450, 545 420, 475 385 Z"
        fill="#e8d6ae" />

      <!-- Caption -->
      <text x="680" y="468" text-anchor="middle" fill="#34513a" font-size="20" font-weight="bold">
        A sunny day at home
      </text>
    </svg>
  </main>
</body>
</html>
